[project]
name = "finos-mcp-evals"
version = "0.1.0"
description = "Eval suites and metrics collection for finos-mcp (not published)"
requires-python = ">=3.12"
dependencies = [
  "finos-mcp-core",
  "finos-mcp-aigf",
  "finos-mcp-cdm",
  "finos-mcp-fdc3",
  "pytest>=8",
  "anyio>=4",
]

[project.optional-dependencies]
# langchain-mcp-adapters / langgraph are deliberately NOT here: the adapter pins the MCP SDK
# to 1.x (it imports mcp.shared.context.RequestContext, removed in 2.x) and installing it
# beside these 2.x servers yields an environment where it cannot import. It talks to the
# servers as stdio subprocesses over the wire protocol, so it belongs in its own environment
# -- see the header of examples/langgraph_agent.py.
llm = [
    "anthropic[mcp]>=1.3",
    "deepeval>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finos_mcp_evals"]
