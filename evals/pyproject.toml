[project]
name = "finos-mcp-evals"
version = "0.1.0"
description = "Eval suites and metrics collection for finos-mcp (not published)"
requires-python = ">=3.12"
dependencies = [
  "finos-mcp-core",
  "finos-mcp-aigf",
  "finos-mcp-cdm",
  "finos-mcp-fdc3",
  "pytest>=8",
  "anyio>=4",
]

[project.optional-dependencies]
llm = ["anthropic[mcp]>=1.3", "deepeval>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finos_mcp_evals"]
