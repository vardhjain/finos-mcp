[project]
name = "finos-mcp-core"
version = "0.1.2"
description = "Shared safety layer for the finos-mcp servers: read-only enforcement, rate limits, size caps, audit log, structured errors. Not affiliated with FINOS."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "finos", "llm", "agents"]
dependencies = [
  "mcp==2.1.1",
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "referencing>=0.35",
  "bm25s>=0.2",
  "rapidfuzz>=3.9",
  "python-frontmatter>=1.1",
  "pyyaml>=6",
  "pystemmer>=2.2",
]

[project.optional-dependencies]
semantic = [
    "model2vec>=0.4",
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/vardhjain/finos-mcp"
Documentation = "https://vardhjain.github.io/finos-mcp/"
Repository = "https://github.com/vardhjain/finos-mcp"
Changelog = "https://github.com/vardhjain/finos-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/vardhjain/finos-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finos_mcp"]
