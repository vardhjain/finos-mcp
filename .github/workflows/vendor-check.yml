name: vendor-check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Re-sync every upstream
        run: |
          uv run python servers/aigf/scripts/sync_upstream.py --ref main
          uv run python servers/cdm/scripts/sync_upstream.py --version 7.9.0 --legacy-version 6.31.0
          uv run python servers/fdc3/scripts/sync_upstream.py --ref v2.2.3
          uv run python servers/fdc3/scripts/generate_intents.py
      - name: Summarise what changed
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet -- ':!**/SOURCE.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- ':!**/SOURCE.json' | tail -40 > /tmp/stat.txt
          fi
      # A changed upstream may invalidate our pinned tests. Keep the failure visible but
      # still create a reviewable sync PR containing the new upstream content.
      - name: Run the parser and drift tests against the new content
        id: drift_tests
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: uv run pytest servers/aigf/tests servers/cdm/tests/test_registry.py servers/fdc3/tests -rf
      # Preserve the staged content before create-pull-request commits/resets it.
      - name: Save reviewable vendor changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vendor-resync"
          git rev-parse HEAD > "$RUNNER_TEMP/vendor-resync/base.txt"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/vendor-resync/vendor.patch"
          cp /tmp/stat.txt "$RUNNER_TEMP/vendor-resync/stat.txt"
      - name: Upload vendor recovery artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vendor-resync
          path: ${{ runner.temp }}/vendor-resync/
          if-no-files-found: error
          retention-days: 14
      - name: Open a pull request
        id: sync_pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/vendor-resync
          title: "chore(vendor): resync AIGF, CDM and FDC3 upstream content"
          commit-message: "chore(vendor): resync upstream content"
          body-path: /tmp/stat.txt
          labels: vendor
      - name: Explain pull request creation failure
        if: failure() && steps.sync_pr.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Vendor changes need a pull request

          The upstream sync completed, but the pull request action failed. Check its
          logs for the cause. If GitHub reports "GitHub Actions is not permitted to
          create or approve pull requests", the repository owner can enable
          **Settings → Actions → General → Workflow permissions → Allow GitHub
          Actions to create and approve pull requests**, then rerun this workflow.

          If the branch was pushed, open a PR from `chore/vendor-resync` to `main`.
          Otherwise download the `vendor-resync` artifact and apply its patch on a
          fresh branch at the commit recorded in `base.txt`. See CONTRIBUTING.md
          for recovery commands. Review the drift-test result before merging.
          This run remains failed; an artifact is not a successful sync PR.
          EOF
      - name: Fail if updated content broke drift tests
        if: steps.diff.outputs.changed == 'true' && steps.drift_tests.outcome == 'failure'
        run: |
          echo "::error::Upstream changed: review the vendor sync PR and update fixtures before merging."
          exit 1

  # The resync above re-fetches the CDM versions already vendored, so it cannot notice a new
  # CDM release. This job compares them with Maven Central and keeps one issue open while a
  # newer stable release exists, closing it once the vendored versions have caught up. It does not bump: that is a reviewed change (see the issue).
  cdm-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: "A newer CDM release is available"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Compare vendored CDM versions with Maven Central
        id: check
        run: uv run python -m finos_mcp_evals.cdm_release_check --out /tmp/cdm-releases.md
      - name: Open or update the tracking issue
        if: steps.check.outputs.newer == 'true'
        run: |
          cat /tmp/cdm-releases.md >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file /tmp/cdm-releases.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/cdm-releases.md --label dependencies
          fi
      - name: Close the tracking issue once nothing newer exists
        if: steps.check.outputs.newer == 'false'
        run: |
          gh issue list --state open --search "in:title \"$TITLE\"" --json number,title             --jq ".[] | select(.title == \"$TITLE\") | .number" |
          while read -r number; do
            gh issue close "$number" --comment "The vendored CDM versions are current again: $(head -1 /tmp/cdm-releases.md)"
          done
