name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    # workflow_dispatch is safe only when started with --ref on a release tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Refuse mismatched release tag and lockfile
        run: |
          python scripts/release_check.py --tag "${GITHUB_REF_NAME}"
          uv lock --check

      - name: Build wheels and sdists for every package
        run: |
          set -euo pipefail
          for pkg in core aigf cdm fdc3; do
            uv build --package "finos-mcp-$pkg" --out-dir dist
          done
          python scripts/release_check.py --tag "${GITHUB_REF_NAME}" --dist dist
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Opt-in: set the repository variable PUBLISH_TO_PYPI=true once a trusted publisher is
  # registered on PyPI for each package. Until then, tagging builds artifacts and cuts a
  # GitHub release without attempting to publish.
  #
  # One job and one environment per package. PyPI keys a *pending* publisher on
  # owner + repository + workflow + environment, and refuses to register the same
  # configuration for a second project, so four packages bootstrapping from one workflow
  # need four environments. It is also the tighter design: each environment can publish
  # exactly one project. Every environment is restricted to v* tags.
  publish-pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            environment: pypi
          - package: aigf
            environment: pypi-aigf
          - package: cdm
            environment: pypi-cdm
          - package: fdc3
            environment: pypi-fdc3
    environment: ${{ matrix.environment }}
    env:
      # Comma-separated packages to leave out of this release, e.g. "fdc3". PyPI allows at
      # most three *pending* publishers per account, so four new projects bootstrap in two
      # rounds: publish three (which turns their pending publishers into ordinary ones and
      # frees the slots), register the fourth, then publish it. See RELEASING.md.
      SKIPPED: ${{ contains(format(',{0},', vars.PYPI_SKIP_PACKAGES), format(',{0},', matrix.package)) }}
    steps:
      - name: Skipped this release
        if: env.SKIPPED == 'true'
        run: echo "::notice::finos-mcp-${{ matrix.package }} is listed in PYPI_SKIP_PACKAGES; not publishing it this release."
      - uses: actions/download-artifact@v8
        if: env.SKIPPED != 'true'
        with:
          name: dist
          path: all-dist/
      - name: Select this package's wheel and sdist
        if: env.SKIPPED != 'true'
        run: |
          mkdir dist
          cp all-dist/finos_mcp_${{ matrix.package }}-* dist/
          ls -la dist
      - name: Publish with trusted publishing (no token secret)
        if: env.SKIPPED != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Public announcement comes *after* the four package uploads when PyPI is
    # enabled. A failed or partially skipped upload must not look like a
    # successful release. GitHub-only releases are allowed when PyPI is disabled.
    needs: [build, publish-pypi]
    if: "${{ !cancelled() && needs.build.result == 'success' && (vars.PUBLISH_TO_PYPI != 'true' || (needs.publish-pypi.result == 'success' && vars.PYPI_SKIP_PACKAGES == '')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Require reviewed release notes for this tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "docs/releases/${GITHUB_REF_NAME}.md" ]]; then
            echo "::error::Missing reviewed release notes for ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md

  dispatch-docker:
    # Release GHCR only after the four packages and GitHub Release succeed.
    # GITHUB_TOKEN tag pushes do not trigger other workflows by themselves.
    needs: github-release
    if: needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch GHCR image only after successful release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Docker publication requires a stable release tag"
            exit 1
          fi
          # This job has no checkout: gh cannot infer the repository from .git.
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f push=true
          echo "Dispatched GHCR publishing for $GITHUB_REF_NAME after a successful GitHub Release"
