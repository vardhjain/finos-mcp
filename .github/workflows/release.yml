name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build wheels and sdists for every package
        run: |
          for pkg in core servers/aigf servers/cdm servers/fdc3; do
            uv build --package "$(uv run python -c "import tomllib,sys;print(tomllib.load(open('$pkg/pyproject.toml','rb'))['project']['name'])")" --out-dir dist
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Opt-in: set the repository variable PUBLISH_TO_PYPI=true once a trusted publisher
  # is configured on PyPI for each package. Until then, tagging builds artifacts and
  # cuts a GitHub release without attempting to publish.
  publish-pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish with trusted publishing (no token secret)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
