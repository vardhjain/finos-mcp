name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build wheels and sdists for every package
        run: |
          for pkg in core servers/aigf servers/cdm servers/fdc3; do
            uv build --package "$(uv run python -c "import tomllib,sys;print(tomllib.load(open('$pkg/pyproject.toml','rb'))['project']['name'])")" --out-dir dist
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Opt-in: set the repository variable PUBLISH_TO_PYPI=true once a trusted publisher is
  # registered on PyPI for each package. Until then, tagging builds artifacts and cuts a
  # GitHub release without attempting to publish.
  #
  # One job and one environment per package. PyPI keys a *pending* publisher on
  # owner + repository + workflow + environment, and refuses to register the same
  # configuration for a second project, so four packages bootstrapping from one workflow
  # need four environments. It is also the tighter design: each environment can publish
  # exactly one project. Every environment is restricted to v* tags.
  publish-pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            environment: pypi
          - package: aigf
            environment: pypi-aigf
          - package: cdm
            environment: pypi-cdm
          - package: fdc3
            environment: pypi-fdc3
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: all-dist/
      - name: Select this package's wheel and sdist
        run: |
          mkdir dist
          cp all-dist/finos_mcp_${{ matrix.package }}-* dist/
          ls -la dist
      - name: Publish with trusted publishing (no token secret)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
