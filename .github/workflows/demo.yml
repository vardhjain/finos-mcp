name: demo-gif

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      - name: Warm the servers once so the recording is not dominated by start-up
        run: uv run python -c "import finos_mcp.aigf.server, finos_mcp.cdm.server, finos_mcp.fdc3.server"
      - name: Render examples/demo.tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: examples/demo.tape
      - name: Commit docs/demo.gif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "docs: render demo.gif from examples/demo.tape" || echo "no change"
          git push
