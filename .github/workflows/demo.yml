name: demo-gif

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-packages
      # Build the CDM schema registry and the AIGF catalog once, into the uv/HF caches,
      # so the recording shows tool latency rather than first-call registry construction
      # (the CDM registry parses ~1100 schemas the first time it is touched).
      - name: Warm the servers and caches
        run: |
          uv run python -c "
          from finos_mcp.cdm.registry import get_registry
          from finos_mcp.aigf.server import state
          from finos_mcp.fdc3.registry import get_registry as fdc3_registry
          get_registry().schema_registry; state(); fdc3_registry()
          print('warm')
          "
      - name: Render examples/demo.tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: examples/demo.tape
      - name: Commit docs/demo.gif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "docs: render demo.gif from examples/demo.tape" || echo "no change"
          git push
