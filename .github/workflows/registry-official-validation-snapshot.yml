name: registry-official-validation-snapshot

# Temporary read-only probe; replaced by persistent checks after review.
on:
  push:
    branches:
      - test/official-mcp-publisher-validate-20261025

permissions:
  contents: read

jobs:
  publisher-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Download and checksum verified official CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo '5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628  '"$RUNNER_TEMP"'/mcp-publisher.tar.gz' | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/mcp-publisher.tar.gz" | head -20
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/mcp-publisher"
          "$RUNNER_TEMP/mcp-publisher" --help
      - name: Run official validate against all three local stdio drafts
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for server in aigf cdm fdc3; do
            echo "=== validating registry/$server/server.json ==="
            "$RUNNER_TEMP/mcp-publisher" validate "registry/$server/server.json" || failed=1
          done
          exit "$failed"
