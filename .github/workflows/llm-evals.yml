name: llm-evals

# Agent evals call a paid third-party API. Never start them from a schedule, PR label,
# or push. The deterministic tests and retrieval evals still run in ci.yml for free.
on:
  workflow_dispatch:
    inputs:
      confirm_paid_api_calls:
        description: "I explicitly approve Anthropic API charges for this run"
        type: boolean
        default: false
      model:
        description: "Model under test (only claude-haiku-4-5 runs publish to the metrics branch)"
        type: choice
        default: "claude-haiku-4-5"
        options:
          - "claude-haiku-4-5"
          - "claude-sonnet-5"
          - "claude-opus-5-5"
      judge:
        description: "Also run the rubric judge (EVAL_JUDGE=1)"
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  tier-c:
    # An unchecked dispatch is a no-op. No model request is made without consent.
    if: inputs.confirm_paid_api_calls == true
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_MODEL: ${{ github.event.inputs.model || 'claude-haiku-4-5' }}
      EVAL_JUDGE: ${{ github.event.inputs.judge == 'true' && '1' || '0' }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      FINOS_MCP_AGENT_OUT: agent.json
      FINOS_MCP_METRICS_OUT: retrieval.json
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync workspace with the llm extra
        run: uv sync --all-packages --extra llm
      - name: Agent-in-the-loop (AIGF)
        run: uv run pytest evals/agent -rA
      # The steps below run even when a gate above fails: a failed eval is exactly when its
      # numbers matter, and skipping them would leave nothing to diagnose from.
      - name: Retrieval (for the same metrics file)
        if: always()
        run: uv run pytest evals/retrieval -rA
      - name: Collect metrics
        if: always()
        run: >-
          uv run python -m finos_mcp_evals.metrics.collect
          --extra agent.json --extra retrieval.json --out metrics-llm.json
      # always(): the eval results are the diagnostics for a failed gate, so they must survive
      # the failure that makes them interesting.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llm-eval-results
          path: |
            agent.json
            retrieval.json
            metrics-llm.json
          retention-days: 90

  # Publish the agent numbers to their own file on the metrics branch, from a clean checkout.
  # A separate file rather than a merge into metrics.json, so this can never race the ci
  # workflow's publish of the deterministic metrics.
  publish-agent-metrics:
    needs: tier-c
    # always(): publish the numbers a run produced even when they failed a gate. A metrics
    # feed that only records passing runs is not a measurement, it is advertising.
    # Only explicit runs on the baseline model update the published agent series.
    # Keep the last measured result when the opt-in is unchecked or a run is skipped.
    if: >-
      always() && needs.tier-c.result != 'skipped' &&
      inputs.confirm_paid_api_calls == true &&
      inputs.model == 'claude-haiku-4-5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: llm-eval-results
          path: _agent
      # A run where no call reached the model (exhausted credit, bad key, outage) measured
      # nothing: its rates are all 0, and a 0.000 hallucination rate reads as a perfect score.
      # Keep the last real measurement instead. Runs that reached the model and then failed a
      # gate still publish.
      - name: Check the run measured something
        id: measured
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          a = json.load(open("_agent/metrics-llm.json")).get("agent") or {}
          ok = bool(a.get("tasks")) and a.get("errors", 0) < a["tasks"] and a.get("input_tokens", 0) > 0
          print(f"ok={'true' if ok else 'false'}")
          PY
      - name: Not publishing an unmeasured run
        if: steps.measured.outputs.ok != 'true'
        run: echo "::warning::No task reached the model (see the tier-c job); metrics-agent.json keeps the last real run."
      - name: Commit metrics-agent.json to the metrics branch
        if: steps.measured.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics || true
          git checkout -B metrics origin/metrics 2>/dev/null || git checkout --orphan metrics
          find . -maxdepth 1 -not -name . -not -name .git -not -name _agent -exec rm -rf {} +
          cp _agent/metrics-llm.json metrics-agent.json
          rm -rf _agent
          git add -A metrics-agent.json
          git commit -m "metrics(agent): ${GITHUB_SHA::7}" || echo "no change"
          git push origin metrics
