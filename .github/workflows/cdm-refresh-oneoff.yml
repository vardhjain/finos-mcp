name: CDM 7.8.0 one-time vendor generator

# A short-lived, branch-scoped workflow for downloading official upstream
# artifacts where the local execution environment has no network access.
# This file deletes itself in the generated data commit.
on:
  push:
    branches: ["chore/cdm-7.8.0-upstream-20261025"]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Generate vendored CDM 7.8.0 and 6.30.0
        env:
          GITHUB_TOKEN: 
        run: |
          uv sync --all-packages
          uv run --no-sync python servers/cdm/scripts/sync_upstream.py --version 7.8.0 --legacy-version 6.30.0

      - name: Commit official artifacts and remove generator
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cdm-refresh-oneoff.yml .github/workflows/cdm-refresh-trigger.txt
          git add -A servers/cdm/src/finos_mcp/cdm/_vendor
          git status --short
          git diff --cached --check
          git commit -m "vendor(cdm): sync official 7.8.0 schemas and samples"
          git push origin HEAD:chore/cdm-7.8.0-upstream-20261025
