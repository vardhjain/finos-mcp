name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # The `semantic` extra downloads a 15 MB static embedding model on first use.
      # Cache it so the hybrid-search tests do not depend on huggingface.co every run.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-potion-base-4M

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy core/src servers/aigf/src servers/cdm/src servers/fdc3/src

      - name: Verify vendored content provenance
        run: uv run python -m finos_mcp_evals.vendor_check

      - name: Verify generated tool reference is current
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run --no-sync python -m finos_mcp_evals.toolref --check

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing:skip-covered --junitxml=junit.xml

      - name: Capture low-memory live demo
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          FINOS_MCP_AUDIT_PATH: /tmp/finos-demo-audit-ci.jsonl
        run: |
          uv run --no-sync python examples/demo_session.py --fast > demo-transcript.txt
          cat demo-transcript.txt

      - name: Latency benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run python evals/perf/bench.py --n 100 --out perf.json

      - name: Collect metrics
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: >-
          uv run python -m finos_mcp_evals.metrics.collect
          --junit junit.xml --coverage coverage.xml
          --extra perf.json --extra retrieval.json --extra offline-evals.json
          --out metrics.json

      - name: Upload metrics
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: |
            metrics.json
            demo-transcript.txt
            offline-evals.json
            coverage.xml
            junit.xml
          retention-days: 90

  # The Docker image has its own Python runtime, independently of the uv test
  # matrix above. Exercise the actual container before accepting a base-image bump.
  container-smoke:
    name: container smoke (offline, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build production container
        run: docker build --pull --tag finos-mcp:ci .

      - name: Verify packaged servers offline without writable filesystem
        run: |
          docker run --rm -i --read-only --cap-drop ALL --network none \
            --entrypoint python finos-mcp:ci - <<'PY'
          from importlib import import_module
          from pathlib import Path

          from finos_mcp.core import verify

          for name in ("finos_mcp.aigf", "finos_mcp.cdm", "finos_mcp.fdc3"):
              module = import_module(name)
              source = verify(Path(module.__file__).parent / "_vendor")
              assert source.files, f"{name}: vendored provenance is empty"

          from finos_mcp.aigf.parser import load_framework
          from finos_mcp.cdm.registry import get_registry as cdm_registry
          from finos_mcp.fdc3.registry import get_registry as fdc3_registry
          from finos_mcp.aigf.server import create_server as aigf_server
          from finos_mcp.cdm.server import create_server as cdm_server
          from finos_mcp.fdc3.server import create_server as fdc3_server

          aigf = load_framework(Path(import_module("finos_mcp.aigf").__file__).parent / "_vendor")
          assert len(aigf.risks) >= 23 and len(aigf.controls) >= 23
          cdm = cdm_registry()
          assert cdm.get("TradeState") is not None
          assert len(cdm.types()) >= 1000
          fdc3 = fdc3_registry()
          assert len(fdc3.context_types()) >= 28
          assert len(fdc3.intents()) >= 19

          for create in (aigf_server, cdm_server, fdc3_server):
              assert create() is not None
          print("All three MCP servers load, validate vendored content and start offline.")
          PY

      - name: Check all three console commands
        run: |
          for server in finos-mcp-aigf finos-mcp-cdm finos-mcp-fdc3; do
            docker run --rm --read-only --cap-drop ALL --network none \
              --entrypoint "$server" finos-mcp:ci --help > /dev/null
            echo "ok: $server"
          done

  publish-metrics:
    name: publish metrics branch
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: metrics
          path: _metrics
      - name: Commit metrics.json to the metrics branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics || true
          # Only clear the tree when creating the branch: it also holds metrics-agent.json,
          # written by the nightly llm-evals workflow, which this job must not delete.
          if ! git checkout -B metrics origin/metrics 2>/dev/null; then
            git checkout --orphan metrics
            git rm -rfq . 2>/dev/null || true
          fi
          cp _metrics/metrics.json metrics.json
          git add metrics.json
          git commit -m "metrics: ${GITHUB_SHA::7}" || echo "no change"
          git push origin metrics
