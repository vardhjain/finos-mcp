name: plugin-packaging

on:
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "scripts/validate_plugin_packaging.py"
      - "docs/plugins.md"
      - ".github/workflows/plugin-packaging.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "scripts/validate_plugin_packaging.py"
      - ".github/workflows/plugin-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: plugin manifests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Claude and portable plugin configs
        run: python scripts/validate_plugin_packaging.py
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Smoke-check pinned PyPI CLI entry points
        shell: bash
        run: |
          for package in finos-mcp-aigf finos-mcp-cdm finos-mcp-fdc3; do
            uvx --python 3.12 "${package}==0.3.2" --help > /dev/null
            echo "OK: ${package}"
          done
