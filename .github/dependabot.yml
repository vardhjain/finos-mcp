version: 2

# Weekly, grouped, so a routine week is at most one PR per ecosystem. Security updates are
# not affected by the schedule or the grouping: Dependabot opens those as soon as an
# advisory lands, once alerts are enabled in the repository's settings.
updates:
  # uv.lock at the root covers the whole workspace (core, the three servers, evals).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # mcp is pinned exactly (core/pyproject.toml): the servers rely on SDK 2.x internals
      # (MCPServer middleware, result shapes), so a bump is a deliberate change with its own
      # testing, not a routine update.
      - dependency-name: mcp

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
