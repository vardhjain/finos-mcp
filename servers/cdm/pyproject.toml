[project]
name = "finos-mcp-cdm"
version = "0.1.0"
description = "Read-only MCP server exposing the FINOS cdm standard as typed tools"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["finos-mcp-core"]

[project.scripts]
finos-mcp-cdm = "finos_mcp.cdm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finos_mcp"]
