[project]
name = "finos-mcp-aigf"
version = "0.1.0"
description = "Read-only MCP server exposing the FINOS aigf standard as typed tools"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["finos-mcp-core"]

[project.scripts]
finos-mcp-aigf = "finos_mcp.aigf.__main__:main"

[project.optional-dependencies]
semantic = [
    "finos-mcp-core[semantic]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finos_mcp"]

[tool.uv.sources]
finos-mcp-core = { workspace = true }
